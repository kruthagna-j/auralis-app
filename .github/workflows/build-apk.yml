name: Build Auralis APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java (required by the Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build the Android APK
        # A "release" build needs a private signing keystore that only the
        # original maintainer has (correctly not included in the source —
        # committing a signing key would be a security mistake). A debug
        # build is fully functional and uses Android's auto-generated debug
        # key instead, so it doesn't need one.
        run: flutter build apk --debug --split-per-abi

      # Uploads the built APKs as a downloadable artifact on this workflow
      # run's summary page — no separate hosting or release step needed.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: auralis-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
